<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>anyview — раздел в разработке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0C0D0F}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #131416; color: #FAFAFA; font-family: 'Exo 2', system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06)">
<a href="Main.dc.html" aria-label="anyview — на главную" style="display: flex; align-items: center; gap: 8px; flex: none; min-height: 44px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="{{accent}}"></rect><path d="M13 10.5v11l8.5-5.5z" fill="#FFFFFF"></path></svg>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">any<span style="color: {{accent}}">view</span></span>
</a>
<a href="Search.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 9999px; background: #1E1F23; color: rgba(255,255,255,0.62); font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span class="clamp1">Найти аниме…</span>
</a>
</header>

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px 24px 32px; text-align: center">
<div aria-hidden="true" style="position: relative; width: 260px; height: 210px">
<div style="position: absolute; left: 22px; top: 34px; width: 100px; height: 150px; border-radius: 14px; background: #1A1B1F; border: 1px solid rgba(255,255,255,0.08); transform: rotate(-12deg); box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px">
<div style="width: 70%; height: 8px; border-radius: 4px; background: #2A2B30"></div>
<div style="width: 45%; height: 8px; border-radius: 4px; background: #2A2B30"></div>
</div>
<div style="position: absolute; left: 138px; top: 34px; width: 100px; height: 150px; border-radius: 14px; background: #1A1B1F; border: 1px solid rgba(255,255,255,0.08); transform: rotate(12deg); box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px">
<div style="width: 70%; height: 8px; border-radius: 4px; background: #2A2B30"></div>
<div style="width: 45%; height: 8px; border-radius: 4px; background: #2A2B30"></div>
</div>
<div style="position: absolute; left: 76px; top: 14px; width: 108px; height: 162px; border-radius: 16px; background: #222328; border: 1px solid rgba(255,255,255,0.12); box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">
<div style="width: 75%; height: 9px; border-radius: 5px; background: #33343A"></div>
<div style="width: 50%; height: 9px; border-radius: 5px; background: #33343A"></div>
</div>
<div style="position: absolute; left: 98px; top: 52px; width: 64px; height: 64px; border-radius: 9999px; background: {{accent}}; border: 4px solid #222328; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<sc-if value="{{isSeries}}" hint-placeholder-val="{{ true }}">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M8 2.5l4 3.5 4-3.5"></path></svg>
</sc-if>
<sc-if value="{{isMovies}}" hint-placeholder-val="{{ false }}">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M7 3v18"></path><path d="M17 3v18"></path><path d="M3 8h4"></path><path d="M3 12h4"></path><path d="M3 16h4"></path><path d="M17 8h4"></path><path d="M17 12h4"></path><path d="M17 16h4"></path></svg>
</sc-if>
</div>
<span style="position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%) rotate(-5deg); padding: 6px 14px; border-radius: 6px; background: #FFC53D; color: #131416; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; white-space: nowrap">В РАЗРАБОТКЕ</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em">{{headline}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.72)">{{body}}</p>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; align-self: stretch; text-align: left">
<sc-for list="{{features}}" as="f" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #1A1B1F; font-size: 14px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{f}}</li>
</sc-for>
</ul>

<div style="display: flex; flex-direction: column; gap: 8px; align-self: stretch">
<a href="Catalog.dc.html" style="height: 48px; border-radius: 9999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Смотреть аниме</a>
<a href="Main.dc.html" style="height: 48px; border-radius: 9999px; background: #1E1F23; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">На главную</a>
</div>
</main>

<nav aria-label="Разделы" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; background: #17181B; border-top: 1px solid rgba(255,255,255,0.06)">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.62)">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg>
</span>Главная</a>
<a href="Catalog.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.62)">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
</span>Аниме</a>
<a href="Soon.dc.html" aria-current="{{seriesCurrent}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 11px; font-weight: 600; color: {{seriesColor}}">
<span style="width: 56px; height: 30px; border-radius: 9999px; background: {{seriesPill}}; display: flex; align-items: center; justify-content: center; color: {{seriesIcon}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M8 2.5l4 3.5 4-3.5"></path></svg>
</span>Сериалы</a>
<a href="Soon.dc.html" aria-current="{{moviesCurrent}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 11px; font-weight: 600; color: {{moviesColor}}">
<span style="width: 56px; height: 30px; border-radius: 9999px; background: {{moviesPill}}; display: flex; align-items: center; justify-content: center; color: {{moviesIcon}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M7 3v18"></path><path d="M17 3v18"></path><path d="M3 8h4"></path><path d="M3 12h4"></path><path d="M3 16h4"></path><path d="M17 8h4"></path><path d="M17 12h4"></path><path d="M17 16h4"></path></svg>
</span>Фильмы</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AFF","options":["#6D4AFF","#2563EB","#C93A40","#0B7A76"]},"section":{"editor":"enum","default":"series","options":["series","movies"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AFF';
    const isSeries = (this.props.section ?? 'series') !== 'movies';
    const muted = 'rgba(255,255,255,0.62)';
    const nav = (active) => ({
      color: active ? '#FAFAFA' : muted,
      pill: active ? accent : 'transparent',
      icon: active ? '#FFFFFF' : muted,
      current: active ? 'page' : 'false'
    });
    const s = nav(isSeries);
    const m = nav(!isSeries);
    return {
      accent, isSeries, isMovies: !isSeries,
      headline: isSeries ? 'Сериалы уже в пути' : 'Фильмы уже в пути',
      body: isSeries
        ? 'Собираем каталог сериалов с русскими и оригинальными названиями, рейтингами и списками серий по сезонам. А пока загляните в аниме: там уже всё работает.'
        : 'Собираем каталог фильмов с русскими и оригинальными названиями, рейтингами и описаниями. А пока загляните в аниме: там уже всё работает.',
      features: isSeries
        ? ['Сезоны и серии в одном плейлисте', 'Рейтинги и описания', 'Выбор озвучки и качества']
        : ['Новинки и подборки', 'Рейтинги и описания', 'Выбор озвучки и качества'],
      seriesColor: s.color, seriesPill: s.pill, seriesIcon: s.icon, seriesCurrent: s.current,
      moviesColor: m.color, moviesPill: m.pill, moviesIcon: m.icon, moviesCurrent: m.current
    };
  }
}
</script>
</body>
</html>
