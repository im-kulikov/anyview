<span style="font-size: 13px; color: rgba(255,255,255,0.66)">{{t.meta}}</span>
<span class="clamp2" style="font-size: 15px; font-weight: 600; line-height: 1.3">{{t.ru}}</span>

<sc-for list="{{skeletons}}" as="s" hint-placeholder-count="6">
<div class="skel" aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div style="width: 100%; aspect-ratio: 2 / 3; border-radius: 16px; background: #1E1F23"></div>
<div style="width: 45%; height: 12px; border-radius: 6px; background: #1E1F23"></div>
<div style="width: 80%; height: 14px; border-radius: 7px; background: #1E1F23"></div>
</div>
</sc-for>
</div>
<p role="status" style="margin: 0; text-align: center; font-size: 14px; color: rgba(255,255,255,0.62)">Загружаем ещё…</p>

<footer style="border-top: 1px solid rgba(255,255,255,0.06)">
