<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>anyview — раздел в разработке, десктоп</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#131416}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlink:hover{background:#26272C}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #131416; color: #FAFAFA; font-family: 'Exo 2', system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(19,20,22,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)">
<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="Desktop.dc.html" aria-label="anyview — на главную" style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="{{accent}}"></rect><path d="M13 10.5v11l8.5-5.5z" fill="#FFFFFF"></path></svg>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">any<span style="color: {{accent}}">view</span></span>
</a>
<nav aria-label="Разделы" style="display: flex; flex-wrap: wrap; gap: 4px">
<a class="navlink" href="Desktop.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 9999px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.78)">Главная</a>
<a class="navlink" href="DesktopAnime.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 9999px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.78)">Аниме</a>
<a href="DesktopSoon.dc.html" aria-current="{{seriesCurrent}}" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 9999px; background: {{seriesBg}}; color: {{seriesColor}}; font-size: 15px; font-weight: 600">Сериалы<span style="padding: 1px 6px; border-radius: 6px; background: {{seriesBadge}}; font-size: 11px">скоро</span></a>
<a href="DesktopSoon.dc.html" aria-current="{{moviesCurrent}}" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 9999px; background: {{moviesBg}}; color: {{moviesColor}}; font-size: 15px; font-weight: 600">Фильмы<span style="padding: 1px 6px; border-radius: 6px; background: {{moviesBadge}}; font-size: 11px">скоро</span></a>
</nav>
<a href="DesktopSearch.dc.html" style="margin-left: auto; flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 9999px; background: #1E1F23; color: rgba(255,255,255,0.62); font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span class="clamp1" style="flex: 1">Найти аниме…</span>
<span style="padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.16); font-size: 12px">/</span>
</a>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; box-sizing: border-box; padding: 72px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 48px 72px">
<div aria-hidden="true" style="flex: none; position: relative; width: 340px; height: 280px">
<div style="position: absolute; left: 28px; top: 44px; width: 132px; height: 198px; border-radius: 18px; background: #1A1B1F; border: 1px solid rgba(255,255,255,0.08); transform: rotate(-12deg); box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<div style="width: 70%; height: 10px; border-radius: 5px; background: #2A2B30"></div>
<div style="width: 45%; height: 10px; border-radius: 5px; background: #2A2B30"></div>
</div>
<div style="position: absolute; left: 180px; top: 44px; width: 132px; height: 198px; border-radius: 18px; background: #1A1B1F; border: 1px solid rgba(255,255,255,0.08); transform: rotate(12deg); box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<div style="width: 70%; height: 10px; border-radius: 5px; background: #2A2B30"></div>
<div style="width: 45%; height: 10px; border-radius: 5px; background: #2A2B30"></div>
</div>
<div style="position: absolute; left: 99px; top: 18px; width: 142px; height: 213px; border-radius: 20px; background: #222328; border: 1px solid rgba(255,255,255,0.12); box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; box-shadow: 0 18px 40px rgba(0,0,0,0.45)">
<div style="width: 75%; height: 11px; border-radius: 6px; background: #33343A"></div>
<div style="width: 50%; height: 11px; border-radius: 6px; background: #33343A"></div>
</div>
<div style="position: absolute; left: 128px; top: 66px; width: 84px; height: 84px; border-radius: 9999px; background: {{accent}}; border: 5px solid #222328; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<sc-if value="{{isSeries}}" hint-placeholder-val="{{ true }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M8 2.5l4 3.5 4-3.5"></path></svg>
</sc-if>
<sc-if value="{{isMovies}}" hint-placeholder-val="{{ false }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M7 3v18"></path><path d="M17 3v18"></path><path d="M3 8h4"></path><path d="M3 12h4"></path><path d="M3 16h4"></path><path d="M17 8h4"></path><path d="M17 12h4"></path><path d="M17 16h4"></path></svg>
</sc-if>
</div>
<span style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%) rotate(-5deg); padding: 8px 18px; border-radius: 8px; background: #FFC53D; color: #131416; font-size: 14px; font-weight: 800; letter-spacing: 0.08em; white-space: nowrap">В РАЗРАБОТКЕ</span>
</div>

<div style="flex: 1 1 420px; min-width: 0; max-width: 520px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 44px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em">{{headline}}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: rgba(255,255,255,0.72)">{{body}}</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{features}}" as="f" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #1A1B1F; font-size: 15px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{f}}</li>
</sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="DesktopAnime.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 28px; border-radius: 9999px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700">Смотреть аниме</a>
<a href="Desktop.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 9999px; background: #1E1F23; font-size: 15px; font-weight: 600">На главную</a>
</div>
</div>
</main>

<footer style="border-top: 1px solid rgba(255,255,255,0.06)">
<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: rgba(255,255,255,0.62)">
<span>anyview · MVP</span>
<span>Данные и видео: AnimeVost</span>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AFF","options":["#6D4AFF","#2563EB","#C93A40","#0B7A76"]},"section":{"editor":"enum","default":"series","options":["series","movies"]},"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AFF';
    const isSeries = (this.props.section ?? 'series') !== 'movies';
    const nav = (active) => ({
      bg: active ? accent : 'transparent',
      color: active ? '#FFFFFF' : 'rgba(255,255,255,0.78)',
      badge: active ? 'rgba(255,255,255,0.22)' : '#26272C',
      current: active ? 'page' : 'false'
    });
    const s = nav(isSeries);
    const m = nav(!isSeries);
    return {
      accent, isSeries, isMovies: !isSeries,
      headline: isSeries ? 'Сериалы уже в пути' : 'Фильмы уже в пути',
      body: isSeries
        ? 'Собираем каталог сериалов с русскими и оригинальными названиями, рейтингами и списками серий по сезонам. А пока загляните в аниме: там уже всё работает.'
        : 'Собираем каталог фильмов с русскими и оригинальными названиями, рейтингами и описаниями. А пока загляните в аниме: там уже всё работает.',
      features: isSeries
        ? ['Сезоны и серии в одном плейлисте', 'Рейтинги и описания', 'Выбор озвучки и качества']
        : ['Новинки и подборки', 'Рейтинги и описания', 'Выбор озвучки и качества'],
      seriesBg: s.bg, seriesColor: s.color, seriesBadge: s.badge, seriesCurrent: s.current,
      moviesBg: m.bg, moviesColor: m.color, moviesBadge: m.badge, moviesCurrent: m.current
    };
  }
}
</script>
</body>
</html>
