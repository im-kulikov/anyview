<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>anyview — поиск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0C0D0F}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
input::placeholder{color:rgba(255,255,255,0.5)}
input:focus{outline:none}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #131416; color: #FAFAFA; font-family: 'Exo 2', system-ui, sans-serif">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="Main.dc.html" aria-label="Закрыть поиск" style="flex: none; width: 44px; height: 44px; border-radius: 9999px; background: #1E1F23; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 16px; border-radius: 9999px; background: #1E1F23; box-shadow: inset 0 0 0 2px {{accent}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск по названию</span>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Название на русском или оригинальное" style="flex: 1; min-width: 0; height: 40px; border: none; background: transparent; color: #FAFAFA; font-family: 'Exo 2', system-ui, sans-serif; font-size: 15px">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{clear}}" aria-label="Очистить" style="flex: none; width: 32px; height: 32px; border-radius: 9999px; border: none; background: #2E2F35; color: #FAFAFA; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
</sc-if>
</label>
</div>

<div role="group" aria-label="Где искать" style="display: flex; gap: 8px; padding: 0 16px 12px">
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 9999px; border: none; background: {{accent}}; color: #FFFFFF; font-family: 'Exo 2', system-ui, sans-serif; font-size: 13px; font-weight: 600">Аниме</button>
<button type="button" disabled="disabled" style="height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.55); font-family: 'Exo 2', system-ui, sans-serif; font-size: 13px; font-weight: 500">Сериалы · скоро</button>
<button type="button" disabled="disabled" style="height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.55); font-family: 'Exo 2', system-ui, sans-serif; font-size: 13px; font-weight: 500">Фильмы · скоро</button>
</div>

<sc-if value="{{noQ}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; padding: 8px 16px 0">
<h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Недавние запросы</h2>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: none; background: none; color: #FAFAFA; font-family: 'Exo 2', system-ui, sans-serif; font-size: 15px; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>{{r.text}}</button>
</sc-for>
</section>
</sc-if>

<section style="display: flex; flex-direction: column; padding: 16px 16px 0">
<h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.62)">{{listTitle}}</h2>
<sc-for list="{{results}}" as="t" hint-placeholder-count="5">
<a href="Title.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06)">
<span style="flex: none; width: 52px; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: #1E1F23">
<img src="{{t.poster}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span class="clamp1" style="font-size: 15px; font-weight: 600">{{t.ru}}</span>
<span class="clamp1" style="font-size: 13px; color: rgba(255,255,255,0.62)">{{t.orig}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: rgba(255,255,255,0.62)">{{t.meta}} ·
<svg width="11" height="11" viewBox="0 0 24 24" fill="#FFC53D" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"></path></svg>{{t.rating}}</span>
</span>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 24px; text-align: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path><path d="M8.5 11h5"></path></svg>
<p style="margin: 0; font-size: 16px; font-weight: 600">Ничего не нашли</p>
<p style="margin: 0; font-size: 14px; color: rgba(255,255,255,0.62)">Попробуйте оригинальное название или часть слова</p>
</div>
</sc-if>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AFF","options":["#6D4AFF","#2563EB","#C93A40","#0B7A76"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'ра' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#6D4AFF';
    const q = this.state.q || '';
    const P = {
      p01: '/_blob/e93c54311b6ab68324473052d83d5f01', p02: '/_blob/b0806507ac02fa6fca18e681e3ec3f7e',
      p03: '/_blob/b73d0e382c66f7a092b64e3be93fca3d', p04: '/_blob/3532bf021d33c1db4c7bf0e536fa631f',
      p05: '/_blob/3358407546c23cebf353f261f78e4480', p06: '/_blob/d9bb53a5f48ea81f864e486c147683e8',
      p07: '/_blob/ca958fb0c41d99035a05ad52cfc5790f', p08: '/_blob/7259e417e80fc20b75c9d43747f307ef',
      p09: '/_blob/44dc7610eba23f6f8b7aaa43cd53079f', p10: '/_blob/1b944b9bbf74ac1f28bf44eb03a2455e',
      p11: '/_blob/e47986e306746b9dbb7983260b549cee', p12: '/_blob/5de7a997d81f579904261b705ee2540a'
    };
    const T = [
      { ru: 'Клинок рассвета', orig: 'Akatsuki no Tsurugi', kind: 'ТВ', year: 2026, rating: '8.6', poster: P.p01 },
      { ru: 'Морской дракон Рю', orig: 'Kairyuu no Ryuu', kind: 'ТВ', year: 2026, rating: '8.4', poster: P.p10 },
      { ru: 'Город без теней', orig: 'Kage no Nai Machi', kind: 'ТВ', year: 2026, rating: '7.9', poster: P.p02 },
      { ru: 'Последний поезд на Луну', orig: 'Tsuki e no Saishuu Ressha', kind: 'Фильм', year: 2025, rating: '8.9', poster: P.p03 },
      { ru: 'Хроники парящего острова', orig: 'Fuyuu-tou Senki', kind: 'ТВ', year: 2026, rating: '8.1', poster: P.p04 },
      { ru: 'Ведьма из книжной лавки', orig: 'Honya no Majo', kind: 'ТВ', year: 2026, rating: '7.6', poster: P.p05 },
      { ru: 'Сто дней до весны', orig: 'Haru made Hyakunichi', kind: 'ТВ', year: 2025, rating: '8.3', poster: P.p06 },
      { ru: 'Неоновый самурай', orig: 'Neon Samurai', kind: 'ONA', year: 2026, rating: '7.4', poster: P.p07 },
      { ru: 'Сад механических бабочек', orig: 'Kikai Chou no Niwa', kind: 'ТВ', year: 2026, rating: '8.0', poster: P.p08 },
      { ru: 'Тихий дозор', orig: 'Shizuka na Mihari', kind: 'ТВ', year: 2025, rating: '7.8', poster: P.p09 },
      { ru: 'Школа звёздных картографов', orig: 'Hoshi Chizu Gakuen', kind: 'ТВ', year: 2026, rating: '7.7', poster: P.p11 },
      { ru: 'Пепел и лаванда', orig: 'Hai to Lavender', kind: 'OVA', year: 2025, rating: '8.2', poster: P.p12 }
    ].map((t) => ({ ...t, meta: t.kind + ' · ' + t.year }));
    const needle = q.trim().toLowerCase();
    const results = needle
      ? T.filter((t) => (t.ru + ' ' + t.orig).toLowerCase().includes(needle)).slice(0, 6)
      : T.slice(0, 4);
    const set = (text) => () => this.setState({ q: text });
    return {
      accent, q, results,
      hasQ: !!q,
      noQ: !needle,
      empty: !!needle && results.length === 0,
      listTitle: needle ? 'Найдено: ' + results.length : 'Часто ищут',
      recent: ['клинок', 'город без теней', 'ведьма'].map((text) => ({ text, pick: set(text) })),
      onQ: (e) => this.setState({ q: e.target.value }),
      clear: set('')
    };
  }
}
</script>
</body>
</html>
